    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #FFB703;
            --secondary-color: #0057B8;
            --dark-gray: #1a1a1a;
            --light-gray: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
        }
    }

    @layer base {
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-primary);
        }
        
        h1, h2, h3, h4 {
            font-weight: 700;
        }
    }

    @layer components {
        .btn-primary {
            @apply px-6 py-3 rounded-lg font-medium transition-all duration-300;
            background-color: var(--primary-color);
            color: var(--dark-gray);
        }
        
        .btn-primary:hover {
            @apply shadow-lg transform -translate-y-0.5;
        }
        
        .btn-secondary {
            @apply px-6 py-3 rounded-lg font-medium border-2 transition-all duration-300;
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }
        
        .btn-secondary:hover {
            background-color: var(--secondary-color);
            @apply text-white;
        }
        
        .section-padding {
            @apply py-20 px-6;
        }
    }
    </style>
</head>

</body>
